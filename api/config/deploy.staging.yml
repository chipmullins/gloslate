service: hometab-staging

proxy:
  ssl: true
  hosts:
    - staging.<%= ENV.fetch("HOMETAB_DOMAIN") %>
  healthcheck:
    path: /up

env:
  clear:
    DB_HOST: hometab-staging-db
    PUBLIC_URL: https://staging.<%= ENV.fetch("HOMETAB_DOMAIN") %>
    ALLOWED_HOSTS: staging.<%= ENV.fetch("HOMETAB_DOMAIN") %>
    MAIL_FROM: "HomeTab Staging <hello@<%= ENV.fetch("HOMETAB_DOMAIN") %>>"
    S3_BUCKET: <%= ENV.fetch("STAGING_BUCKET") %>

accessories:
  db:
    directories:
      - /data/hometab-staging-db:/var/lib/postgresql/data
