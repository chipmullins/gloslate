# Kamal 2. Staging and production share one small server (see infra/aws).
# Deploys run from GitHub Actions (.github/workflows/deploy.yml), which sets
# HOMETAB_HOST_IP, HOMETAB_DOMAIN, the bucket names and the secrets.
service: hometab
image: chipmullins/hometab-api

servers:
  web:
    - <%= ENV.fetch("HOMETAB_HOST_IP", "127.0.0.1") %>

registry:
  server: ghcr.io
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME", "chipmullins") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

ssh:
  user: ubuntu
  keys_only: true
  keys: ["~/.ssh/hometab_deploy"]

builder:
  arch: amd64

env:
  secret:
    - SECRET_KEY_BASE
    - HOMETAB_DATABASE_PASSWORD
  clear:
    SOLID_QUEUE_IN_PUMA: true
    RAILS_MAX_THREADS: 3
    AWS_REGION: us-east-1
    ACTIVE_STORAGE_SERVICE: amazon
    MAIL_DELIVERY: ses
    SMS_DELIVERY: sns
    APPLE_CLIENT_IDS: "<%= ENV.fetch("APPLE_CLIENT_IDS", "app.hometab") %>"
    GOOGLE_CLIENT_IDS: "<%= ENV.fetch("GOOGLE_CLIENT_IDS", "") %>"
    APPLE_TEAM_ID: "<%= ENV.fetch("APPLE_TEAM_ID", "") %>"
    ANDROID_CERT_SHA256: "<%= ENV.fetch("ANDROID_CERT_SHA256", "") %>"

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  logs: app logs -f

# Postgres for this destination, data on the server's /data disk (backed up nightly).
accessories:
  db:
    image: postgres:16
    host: <%= ENV.fetch("HOMETAB_HOST_IP", "127.0.0.1") %>
    env:
      clear:
        POSTGRES_USER: hometab
        POSTGRES_DB: hometab_production
      secret:
        - POSTGRES_PASSWORD
    cmd: postgres -c shared_buffers=64MB -c max_connections=30
