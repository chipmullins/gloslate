name: Release

# Builds Gloslate's server image and stores it in GitHub's package registry.
# The server checks the registry every 2 minutes and updates itself, so
# nothing here needs (or has) any access to AWS.
#
#   Push to main (api/**)  -> new :staging image -> staging.tabitat.app updates
#   Run workflow           -> "promote" copies :staging to :production -> tabitat.app updates
on:
  push:
    branches: [main]
    paths: ["api/**", ".github/workflows/release.yml"]
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options: [promote staging to production, rebuild staging]
        default: promote staging to production

permissions:
  contents: read
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/chipmullins/tabitat-api

jobs:
  staging:
    if: github.event_name == 'push' || inputs.action == 'rebuild staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The web version of the app (app.tabitat.app) ships inside the same image.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Build the web app
        working-directory: mobile
        run: |
          npm ci
          EXPO_OFFLINE=1 CI=1 npx expo export --platform web --output-dir ../api/public/webapp
          test -f ../api/public/webapp/index.html
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: api
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Boot the exact image the server will run, against a real Postgres, before staging gets it.
      - name: Smoke test (boots, migrates, serves the site)
        run: |
          docker network create smoke
          docker run -d --name staging-db --network smoke -e POSTGRES_USER=tabitat -e POSTGRES_PASSWORD=pw -e POSTGRES_DB=tabitat_production postgres:16
          for i in $(seq 1 30); do docker exec staging-db pg_isready -U tabitat >/dev/null 2>&1 && break; sleep 2; done
          grep -v '^#' api/deploy/staging.env > smoke.env
          docker run -d --name web --network smoke -p 8080:80 --env-file smoke.env \
            -e SECRET_KEY_BASE=$(openssl rand -hex 64) -e TABITAT_DATABASE_PASSWORD=pw \
            -e S3_BUCKET=smoke -e AWS_REGION=us-east-1 -e ALLOWED_HOSTS=staging.tabitat.app,app.smoke.test -e WEBAPP_HOSTS=app.smoke.test \
            "$IMAGE:sha-$GITHUB_SHA"
          ok=""
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://localhost:8080/up && ok=1 && break; sleep 3; done
          [ -n "$ok" ] || { docker logs web | tail -80; exit 1; }
          for path in / /privacy /terms /support /icon.svg; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: staging.tabitat.app' "http://localhost:8080$path")
            echo "$path -> $code"; [ "$code" = 200 ] || { docker logs web | tail -80; exit 1; }
          done
          curl -fsS -H 'Host: staging.tabitat.app' http://localhost:8080/ | grep -q "Stop texting"
          # The web app: the page, a deep link, and a bundle it points at.
          for path in / /group/x /onboarding; do
            curl -fsS -H 'Host: app.smoke.test' "http://localhost:8080$path" | grep -q "_expo/static/js" || { echo "web app $path missing"; exit 1; }
          done
          bundle=$(curl -fsS -H 'Host: app.smoke.test' http://localhost:8080/ | grep -o '/_expo/static/js/web/[^"]*\.js' | head -1)
          curl -fsS -o /dev/null -H 'Host: app.smoke.test' "http://localhost:8080$bundle"
          # Background jobs start a few seconds after the web server; make sure they stay up.
          sleep 25
          [ "$(docker inspect -f '{{.State.Running}}' web)" = true ] || { docker logs web | tail -80; exit 1; }
          if docker logs web 2>&1 | grep -qE "Solid Queue has gone away|StatementInvalid"; then docker logs web | tail -80; exit 1; fi
          docker logs web 2>&1 | grep -q "Started Scheduler" || { echo "background jobs didn't start"; docker logs web | tail -80; exit 1; }
          curl -fsS -o /dev/null http://localhost:8080/up
      - name: Tag as staging
        run: |
          docker buildx imagetools create -t "$IMAGE:staging" "$IMAGE:sha-$GITHUB_SHA"
          echo "Built and smoke-tested **staging** from \`${GITHUB_SHA::7}\`. staging.tabitat.app updates within about 2 minutes." >> "$GITHUB_STEP_SUMMARY"

  production:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'promote staging to production'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy staging to production
        run: |
          docker buildx imagetools create -t "$IMAGE:production" "$IMAGE:staging"
          REV=$(docker buildx imagetools inspect "$IMAGE:staging" --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}' 2>/dev/null || true)
          echo "Promoted staging (\`${REV::7}\`) to **production**. tabitat.app updates within about 2 minutes." >> "$GITHUB_STEP_SUMMARY"
