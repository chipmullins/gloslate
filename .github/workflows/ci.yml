name: CI
on: [push, pull_request]

jobs:
  money-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Money engine tests (plain Ruby)
        working-directory: api
        run: ruby -Ilib test/lib/ledger_test.rb
