name: CI
on: [push, pull_request]

jobs:
  api:
    runs-on: ubuntu-24.04 # ubuntu-latest (26.04) has no prebuilt Ruby 3.3.6 yet
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hometab
          POSTGRES_PASSWORD: hometab
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://hometab:hometab@localhost:5432/hometab_test
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      # Same image libraries and brand fonts as the production Dockerfile (share images, PDFs).
      - name: Install libvips and fonts
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y libvips42 librsvg2-2 fontconfig
          sudo mkdir -p /usr/local/share/fonts/hometab
          sudo cp api/app/assets/fonts/*.ttf /usr/local/share/fonts/hometab/
          fc-cache -f
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.6"
          bundler-cache: true
          working-directory: api
      - run: bin/rails db:create db:schema:load
      - run: bin/rails zeitwerk:check
      - run: bin/rails test

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
