name: Deploy

# Push to main  -> builds/updates the AWS stack, then deploys staging.
# Run workflow  -> pick "production" to deploy the real site.
# Does nothing until the repo variable AWS_ROLE_ARN is set (see docs/deploy.md).
on:
  push:
    branches: [main]
    paths: ["api/**", "infra/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  id-token: write # sign in to AWS without stored keys
  contents: read
  packages: write # push the app image to ghcr.io

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  STACK: tabitat-infra

jobs:
  infra:
    if: vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    outputs:
      ip: ${{ steps.out.outputs.ip }}
      sg: ${{ steps.out.outputs.sg }}
      staging_bucket: ${{ steps.out.outputs.staging_bucket }}
      production_bucket: ${{ steps.out.outputs.production_bucket }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create secrets that don't exist yet (never overwrites)
        run: |
          put() { # name type value
            aws ssm get-parameter --name "$1" >/dev/null 2>&1 || \
              aws ssm put-parameter --name "$1" --type "$2" --value "$3" --tags Key=Project,Value=tabitat >/dev/null
          }
          if ! aws ssm get-parameter --name /tabitat/deploy-ssh-public-key >/dev/null 2>&1; then
            ssh-keygen -q -t ed25519 -N "" -C tabitat-deploy -f key
            put /tabitat/deploy-ssh-private-key SecureString "$(cat key)"
            put /tabitat/deploy-ssh-public-key String "$(cat key.pub)"
            rm -f key key.pub
          fi
          for env in staging production; do
            put /tabitat/$env/SECRET_KEY_BASE SecureString "$(openssl rand -hex 64)"
            put /tabitat/$env/DATABASE_PASSWORD SecureString "$(openssl rand -hex 24)"
          done

      - name: Create or update the Tabitat stack
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          PUB=$(aws ssm get-parameter --name /tabitat/deploy-ssh-public-key --query Parameter.Value --output text)
          EXTRA=""
          if ! aws cloudformation describe-stacks --stack-name "$STACK" >/dev/null 2>&1; then
            # Pick the Ubuntu image once; later runs keep it, so the server is never replaced by surprise.
            AMI=$(aws ssm get-parameter --name /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id --query Parameter.Value --output text)
            EXTRA="ImageId=$AMI"
          fi
          aws cloudformation deploy \
            --stack-name "$STACK" \
            --template-file infra/aws/tabitat.yml \
            --role-arn "arn:aws:iam::$ACCOUNT:role/tabitat-cfn-exec" \
            --capabilities CAPABILITY_NAMED_IAM \
            --tags Project=tabitat \
            --no-fail-on-empty-changeset \
            --parameter-overrides "DeployPublicKey=$PUB" "Domain=${{ vars.TABITAT_DOMAIN }}" \
              "AlertEmail=${{ vars.ALERT_EMAIL }}" "InstanceType=${{ vars.INSTANCE_TYPE || 't3.micro' }}" $EXTRA

      - id: out
        name: Read stack outputs
        run: |
          o() { aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          echo "ip=$(o ServerIp)" >> "$GITHUB_OUTPUT"
          echo "sg=$(o SecurityGroupId)" >> "$GITHUB_OUTPUT"
          echo "staging_bucket=$(o StagingBucket)" >> "$GITHUB_OUTPUT"
          echo "production_bucket=$(o ProductionBucket)" >> "$GITHUB_OUTPUT"
          {
            echo "### Tabitat server"
            echo "Server IP: \`$(o ServerIp)\`"
            DKIM=$(o DkimRecords); [ -n "$DKIM" ] && [ "$DKIM" != "None" ] && echo "Email DKIM records: $DKIM"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: infra
    if: vars.TABITAT_DOMAIN != ''
    runs-on: ubuntu-latest
    env:
      DEST: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}
      TABITAT_HOST_IP: ${{ needs.infra.outputs.ip }}
      TABITAT_DOMAIN: ${{ vars.TABITAT_DOMAIN }}
      STAGING_BUCKET: ${{ needs.infra.outputs.staging_bucket }}
      PRODUCTION_BUCKET: ${{ needs.infra.outputs.production_bucket }}
      APPLE_CLIENT_IDS: ${{ vars.APPLE_CLIENT_IDS }}
      GOOGLE_CLIENT_IDS: ${{ vars.GOOGLE_CLIENT_IDS }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
      KAMAL_REGISTRY_USERNAME: ${{ github.actor }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.6"
          bundler-cache: true
          working-directory: api
      - uses: docker/setup-buildx-action@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Load secrets for ${{ env.DEST }}
        run: |
          get() { aws ssm get-parameter --with-decryption --name "$1" --query Parameter.Value --output text; }
          SKB=$(get /tabitat/$DEST/SECRET_KEY_BASE); echo "::add-mask::$SKB"; echo "SECRET_KEY_BASE=$SKB" >> "$GITHUB_ENV"
          DBP=$(get /tabitat/$DEST/DATABASE_PASSWORD); echo "::add-mask::$DBP"; echo "TABITAT_DATABASE_PASSWORD=$DBP" >> "$GITHUB_ENV"
          install -d -m 700 ~/.ssh
          get /tabitat/deploy-ssh-private-key > ~/.ssh/tabitat_deploy && chmod 600 ~/.ssh/tabitat_deploy

      - name: Open SSH for this runner only
        run: |
          MY_IP=$(curl -fsS https://checkip.amazonaws.com)
          echo "RUNNER_CIDR=$MY_IP/32" >> "$GITHUB_ENV"
          aws ec2 authorize-security-group-ingress --group-id "${{ needs.infra.outputs.sg }}" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=$MY_IP/32,Description=github-deploy}]"
          for i in $(seq 1 40); do ssh-keyscan -T 5 "$TABITAT_HOST_IP" > ~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts ] && break; sleep 6; done
          # A brand-new server may still be installing Docker.
          ssh -i ~/.ssh/tabitat_deploy ubuntu@"$TABITAT_HOST_IP" 'cloud-init status --wait >/dev/null; docker info >/dev/null'

      - name: Deploy ${{ env.DEST }}
        run: |
          if ssh -i ~/.ssh/tabitat_deploy ubuntu@"$TABITAT_HOST_IP" "docker ps -a --format '{{.Names}}' | grep -qx tabitat-$DEST-db"; then
            bin/kamal deploy -d "$DEST"
          else
            bin/kamal setup -d "$DEST" # first time: database, proxy, app
          fi
          echo "Deployed **$DEST** to \`$TABITAT_HOST_IP\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Close SSH
        if: always() && env.RUNNER_CIDR != ''
        run: |
          aws ec2 revoke-security-group-ingress --group-id "${{ needs.infra.outputs.sg }}" \
            --protocol tcp --port 22 --cidr "$RUNNER_CIDR" || true
          rm -f ~/.ssh/tabitat_deploy
