name: App update (over the air)

# Ships JavaScript-only changes (screens, text, logic) to installed apps without a
# new App Store / TestFlight build. Phones download it on next open and use it the
# time after. Changes to native code (new modules, permissions, app.json plugins)
# change the app's "fingerprint"; those phones keep their bundle until a new build.
# Needs repo secret EXPO_TOKEN and the Expo project ID in mobile/app.json.
on:
  workflow_dispatch:
    inputs:
      message:
        description: What changed (shown in the Expo dashboard)
        required: true
        default: Fixes and polish

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck && npm test
      # Updates only reach builds with the same native fingerprint. If this
      # fails, something native changed since the installed builds: either undo
      # it, or make new builds and then update native-fingerprints.json.
      - name: Check the installed builds can receive this
        run: |
          for p in ios android; do
            now=$(npx expo-updates fingerprint:generate --platform $p | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).hash))')
            want=$(node -p "require('./native-fingerprints.json').$p")
            echo "$p: $now (installed builds: $want)"
            if [ "$now" != "$want" ]; then echo "::error::$p native fingerprint changed ($want -> $now). Installed $p builds won't get this update."; exit 1; fi
          done
      - name: Publish
        run: npx --yes eas-cli@latest update --channel production --message "${{ inputs.message }}" --non-interactive
        env:
          EXPO_PUBLIC_API_URL: https://api.gloslate.app
      - run: echo "Published. Phones pick it up on their next open and run it the time after." >> "$GITHUB_STEP_SUMMARY"
