name: Check domain
# Run by hand: shows what the internet sees for a domain (nameservers, addresses, HTTPS).
on:
  workflow_dispatch:
    inputs:
      domain:
        description: Domain to check
        default: gloslate.app
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Nameservers and addresses
        run: |
          d="${{ inputs.domain }}"
          echo "== nameservers (from the .app registry) =="; dig +short NS "$d" @ns-tld1.charlestonroadregistry.com || true
          echo "== nameservers (public DNS) =="; dig +short NS "$d" @1.1.1.1
          for h in "$d" "www.$d" "api.$d" "app.$d" "staging.$d"; do echo "== $h =="; dig +short A "$h" @1.1.1.1; done
          echo "== email DKIM/DMARC =="; dig +short TXT "_dmarc.$d" @1.1.1.1
      - name: HTTPS
        run: |
          d="${{ inputs.domain }}"
          for u in "https://$d/up" "https://api.$d/up" "https://app.$d/" "https://www.$d/"; do
            printf '%s -> ' "$u"; curl -sS -m 15 -o /dev/null -w '%{http_code}\n' "$u" || echo "no certificate yet"
          done
      - name: Plain HTTP and the old domain (for comparison)
        run: |
          d="${{ inputs.domain }}"
          for u in "http://$d/up" "http://api.$d/up" "http://$d/.well-known/acme-challenge/test" "https://api.tabitat.app/up"; do
            printf '%s -> ' "$u"; curl -sS -m 15 -o /dev/null -w '%{http_code} %{redirect_url}\n' "$u" || echo "failed"
          done
          echo "== certificate logs (crt.sh) =="; curl -sS -m 20 "https://crt.sh/?q=$d&output=json" | head -c 600 || true
