AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  HomeTab one-time setup. Lets GitHub Actions in chipmullins/hometab manage
  HomeTab's own stacks and nothing else in this account. Stack name: hometab-bootstrap.

Parameters:
  GitHubRepo:
    Type: String
    Default: chipmullins/hometab
  CreateGitHubOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      Set to false if this account already has the GitHub OIDC provider
      (token.actions.githubusercontent.com), e.g. because Glofly uses it. It is
      only reused, never changed.

Conditions:
  MakeProvider: !Equals [!Ref CreateGitHubOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain # other projects may start using it; never delete it with HomeTab
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      Tags: [{ Key: Project, Value: hometab }]

  # CloudFormation uses this role to build HomeTab's stack. It can create the
  # kinds of things HomeTab needs, but can only change or delete EC2 and S3
  # things that are tagged / named for HomeTab.
  ExecRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: hometab-cfn-exec
      Tags: [{ Key: Project, Value: hometab }]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: hometab-build
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Ec2
                Effect: Allow
                Action: ec2:*
                Resource: "*"
              - Sid: Ec2OnlyChangeHometabThings
                Effect: Deny
                Action:
                  - ec2:TerminateInstances
                  - ec2:StopInstances
                  - ec2:RebootInstances
                  - ec2:ModifyInstanceAttribute
                  - ec2:DeleteVolume
                  - ec2:DetachVolume
                  - ec2:DeleteVpc
                  - ec2:ModifyVpcAttribute
                  - ec2:DeleteSubnet
                  - ec2:ModifySubnetAttribute
                  - ec2:DeleteSecurityGroup
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:DeleteInternetGateway
                  - ec2:DetachInternetGateway
                  - ec2:DeleteRouteTable
                  - ec2:CreateRoute
                  - ec2:ReplaceRoute
                  - ec2:DeleteRoute
                  - ec2:ReleaseAddress
                  - ec2:DisassociateAddress
                Resource:
                  - arn:aws:ec2:*:*:instance/*
                  - arn:aws:ec2:*:*:volume/*
                  - arn:aws:ec2:*:*:vpc/*
                  - arn:aws:ec2:*:*:subnet/*
                  - arn:aws:ec2:*:*:security-group/*
                  - arn:aws:ec2:*:*:internet-gateway/*
                  - arn:aws:ec2:*:*:route-table/*
                  - arn:aws:ec2:*:*:elastic-ip/*
                Condition:
                  StringNotEquals: { "aws:ResourceTag/Project": hometab }
              - Sid: S3HometabBucketsOnly
                Effect: Allow
                Action: s3:*
                Resource: ["arn:aws:s3:::hometab-*", "arn:aws:s3:::hometab-*/*"]
              - Sid: IamHometabRolesOnly
                Effect: Allow
                Action: iam:*
                Resource:
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/hometab-*
                  - !Sub arn:aws:iam::${AWS::AccountId}:instance-profile/hometab-*
              - Sid: HometabParameters
                Effect: Allow
                Action: ssm:*
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/hometab/*
                  - arn:aws:ssm:*::parameter/aws/service/* # public AMI lookups
              - Sid: Email
                Effect: Allow
                Action: [ses:CreateEmailIdentity, ses:DeleteEmailIdentity, ses:GetEmailIdentity, ses:PutEmailIdentity*,
                         ses:TagResource, ses:UntagResource, ses:CreateConfigurationSet, ses:DeleteConfigurationSet,
                         ses:GetConfigurationSet, ses:PutConfigurationSet*]
                Resource: "*"
              - Sid: Alarms
                Effect: Allow
                Action: [cloudwatch:PutMetricAlarm, cloudwatch:DeleteAlarms, cloudwatch:DescribeAlarms, cloudwatch:TagResource,
                         sns:CreateTopic, sns:DeleteTopic, sns:Subscribe, sns:Unsubscribe, sns:GetTopicAttributes,
                         sns:SetTopicAttributes, sns:TagResource, sns:ListSubscriptionsByTopic,
                         budgets:ModifyBudget, budgets:ViewBudget, budgets:CreateBudgetAction, budgets:TagResource]
                Resource: "*"

  # GitHub Actions uses this role. It can run HomeTab's stacks (through
  # ExecRole), read and write /hometab/* settings, and open SSH on HomeTab's
  # server for the length of a deploy. Nothing else.
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: hometab-github-deploy
      Tags: [{ Key: Project, Value: hometab }]
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals: { "token.actions.githubusercontent.com:aud": sts.amazonaws.com }
              StringLike: { "token.actions.githubusercontent.com:sub": !Sub "repo:${GitHubRepo}:ref:refs/heads/main" }
      Policies:
        - PolicyName: hometab-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: HometabStacks
                Effect: Allow
                Action: cloudformation:*
                Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/hometab-*/*
              - Sid: StackHelpers
                Effect: Allow
                Action: [cloudformation:ValidateTemplate, cloudformation:GetTemplateSummary, cloudformation:ListStacks]
                Resource: "*"
              - Sid: PassOnlyExecRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt ExecRole.Arn
              - Sid: Parameters
                Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters, ssm:PutParameter]
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/hometab/*
                  - arn:aws:ssm:*::parameter/aws/service/*
              - Sid: Describe
                Effect: Allow
                Action: [ec2:DescribeSecurityGroups, ec2:DescribeInstances]
                Resource: "*"
              - Sid: SshDuringDeploy
                Effect: Allow
                Action: [ec2:AuthorizeSecurityGroupIngress, ec2:RevokeSecurityGroupIngress]
                Resource: !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*
                Condition:
                  StringEquals: { "aws:ResourceTag/Project": hometab }

Outputs:
  DeployRoleArn:
    Description: Paste this into GitHub (repo variable AWS_ROLE_ARN), or send it to Claude.
    Value: !GetAtt DeployRole.Arn
