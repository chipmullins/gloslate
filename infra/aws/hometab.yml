AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Tabitat (lean): one small server running staging and production with Kamal,
  Postgres on a separate data disk, nightly backups to S3, files in S3, email
  via SES. Its own network; touches nothing else in the account. Stack name: tabitat-infra.

Parameters:
  ImageId:
    Type: AWS::EC2::Image::Id
    Description: Ubuntu 24.04 amd64. Set once at creation and kept, so the server is never replaced by surprise.
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t3.medium]
  DataVolumeGiB:
    Type: Number
    Default: 10
  DeployPublicKey:
    Type: String
    Description: SSH public key GitHub Actions uses to deploy (generated by the workflow).
  Domain:
    Type: String
    Default: ""
    Description: e.g. tabitat.app. Leave empty until the domain exists; email setup waits for it.
  AlertEmail:
    Type: String
    Default: ""
    Description: Where "server is down" and budget alerts go.
  MonthlyBudgetUsd:
    Type: Number
    Default: 25

Conditions:
  HasDomain: !Not [!Equals [!Ref Domain, ""]]
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Resources:
  # ---- Network (Tabitat's own; no NAT gateway, so no fixed cost) ----
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: tabitat }, { Key: Project, Value: tabitat }]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: tabitat }, { Key: Project, Value: tabitat }]
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref InternetGateway }
  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{ Key: Name, Value: tabitat-public }, { Key: Project, Value: tabitat }]
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: tabitat }, { Key: Project, Value: tabitat }]
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties: { RouteTableId: !Ref RouteTable, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref InternetGateway }
  SubnetRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref Subnet, RouteTableId: !Ref RouteTable }

  # Web only. SSH (22) is opened for one GitHub runner's IP during a deploy, then closed.
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: tabitat-web
      GroupDescription: Tabitat web (80/443). SSH opened only during deploys.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIpv6: "::/0" }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIpv6: "::/0" }
      Tags: [{ Key: Name, Value: tabitat-web }, { Key: Project, Value: tabitat }]

  # ---- Storage ----
  FilesBucketStaging:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub tabitat-staging-files-${AWS::AccountId}
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption: { ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }] }
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      Tags: [{ Key: Project, Value: tabitat }]
  FilesBucketProduction:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub tabitat-production-files-${AWS::AccountId}
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption: { ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }] }
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      VersioningConfiguration: { Status: Enabled }
      Tags: [{ Key: Project, Value: tabitat }]
  BackupsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub tabitat-backups-${AWS::AccountId}
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption: { ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }] }
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      LifecycleConfiguration:
        Rules: [{ Id: keep-35-days, Status: Enabled, ExpirationInDays: 35 }]
      Tags: [{ Key: Project, Value: tabitat }]

  # ---- Server ----
  ServerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: tabitat-server
      Tags: [{ Key: Project, Value: tabitat }]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: ec2.amazonaws.com }, Action: sts:AssumeRole }]
      Policies:
        - PolicyName: tabitat-server
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Files
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:ListBucket]
                Resource:
                  - !GetAtt FilesBucketStaging.Arn
                  - !Sub "${FilesBucketStaging.Arn}/*"
                  - !GetAtt FilesBucketProduction.Arn
                  - !Sub "${FilesBucketProduction.Arn}/*"
              - Sid: BackupsWriteOnly # the server can add backups but never delete them
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${BackupsBucket.Arn}/*"
              - Sid: Email
                Effect: Allow
                Action: [ses:SendEmail, ses:SendRawEmail]
                Resource: "*"
                Condition:
                  StringLike: { "ses:FromAddress": !If [HasDomain, !Sub "*@${Domain}", "nobody@invalid"] }
              - Sid: TextMessages # direct-to-phone only, not topics
                Effect: Allow
                Action: sns:Publish
                NotResource: arn:aws:sns:*:*:*
  ServerProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: { InstanceProfileName: tabitat-server, Roles: [!Ref ServerRole] }

  DataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      AvailabilityZone: !GetAtt Subnet.AvailabilityZone
      Size: !Ref DataVolumeGiB
      VolumeType: gp3
      Encrypted: true
      Tags: [{ Key: Name, Value: tabitat-data }, { Key: Project, Value: tabitat }]

  Server:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref Subnet
      SecurityGroupIds: [!Ref WebSecurityGroup]
      IamInstanceProfile: !Ref ServerProfile
      MetadataOptions: { HttpTokens: required, HttpPutResponseHopLimit: 2 }
      PropagateTagsToVolumeOnCreation: true
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs: { VolumeSize: 16, VolumeType: gp3, Encrypted: true }
      Tags: [{ Key: Name, Value: tabitat }, { Key: Project, Value: tabitat }]
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            set -euxo pipefail
            export DEBIAN_FRONTEND=noninteractive

            # Deploy key for GitHub Actions (Kamal connects as ubuntu).
            install -d -m 700 -o ubuntu -g ubuntu /home/ubuntu/.ssh
            echo "${DeployPublicKey}" >> /home/ubuntu/.ssh/authorized_keys
            chown ubuntu:ubuntu /home/ubuntu/.ssh/authorized_keys && chmod 600 /home/ubuntu/.ssh/authorized_keys
            sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config
            systemctl reload ssh || true

            # Swap, so a 1 GB server rides out memory spikes.
            if [ ! -f /swapfile ]; then fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile; fi
            swapon /swapfile || true
            grep -q /swapfile /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab

            apt-get update -qq
            apt-get install -y -qq docker.io unattended-upgrades
            snap install aws-cli --classic || true
            usermod -aG docker ubuntu
            systemctl enable --now docker

            # Database disk: wait for it to attach, format only if new, mount at /data.
            DEV=/dev/disk/by-id/nvme-Amazon_Elastic_Block_Store_${VolNoDash}
            for i in $(seq 1 60); do [ -e "$DEV" ] && break; sleep 5; done
            blkid "$DEV" || mkfs.ext4 -q -L tabitat-data "$DEV"
            mkdir -p /data
            grep -q tabitat-data /etc/fstab || echo 'LABEL=tabitat-data /data ext4 defaults,nofail 0 2' >> /etc/fstab
            mount -a
            chown ubuntu:ubuntu /data

            # Nightly database backups to S3 (03:15 UTC), kept 35 days.
            cat > /usr/local/bin/tabitat-backup <<'EOS'
            #!/bin/bash
            set -euo pipefail
            for c in $(docker ps --format '{{.Names}}' | grep -E '^tabitat-(staging|production)-db$'); do
              docker exec "$c" pg_dumpall -U tabitat | gzip | \
                /snap/bin/aws s3 cp - "s3://${Bucket}/$c/$(date -u +%Y-%m-%dT%H%M).sql.gz" --only-show-errors
            done
            EOS
            chmod 755 /usr/local/bin/tabitat-backup
            echo '15 3 * * * root /usr/local/bin/tabitat-backup >> /var/log/tabitat-backup.log 2>&1' > /etc/cron.d/tabitat-backup
          - VolNoDash: !Join ["", !Split ["-", !Ref DataVolume]]
            Bucket: !Ref BackupsBucket

  DataAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties: { InstanceId: !Ref Server, VolumeId: !Ref DataVolume, Device: /dev/sdf }

  PublicIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref Server
      Tags: [{ Key: Name, Value: tabitat }, { Key: Project, Value: tabitat }]

  # ---- Email (once the domain exists): add the DKIM records it lists ----
  EmailIdentity:
    Type: AWS::SES::EmailIdentity
    Condition: HasDomain
    Properties:
      EmailIdentity: !Ref Domain
      DkimSigningAttributes: { NextSigningKeyLength: RSA_2048_BIT }

  # ---- DNS for the domain (set the registrar's nameservers to the NameServers output) ----
  Zone:
    Type: AWS::Route53::HostedZone
    Condition: HasDomain
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Ref Domain
      HostedZoneTags: [{ Key: Project, Value: tabitat }]
  SiteRecords:
    Type: AWS::Route53::RecordSetGroup
    Condition: HasDomain
    Properties:
      HostedZoneId: !Ref Zone
      RecordSets:
        - { Name: !Ref Domain, Type: A, TTL: "300", ResourceRecords: [!Ref PublicIp] }
        - { Name: !Sub "api.${Domain}", Type: A, TTL: "300", ResourceRecords: [!Ref PublicIp] }
        - { Name: !Sub "admin-api.${Domain}", Type: A, TTL: "300", ResourceRecords: [!Ref PublicIp] }
        - { Name: !Sub "staging.${Domain}", Type: A, TTL: "300", ResourceRecords: [!Ref PublicIp] }
  EmailRecords:
    Type: AWS::Route53::RecordSetGroup
    Condition: HasDomain
    Properties:
      HostedZoneId: !Ref Zone
      RecordSets:
        - { Name: !GetAtt EmailIdentity.DkimDNSTokenName1, Type: CNAME, TTL: "1800", ResourceRecords: [!GetAtt EmailIdentity.DkimDNSTokenValue1] }
        - { Name: !GetAtt EmailIdentity.DkimDNSTokenName2, Type: CNAME, TTL: "1800", ResourceRecords: [!GetAtt EmailIdentity.DkimDNSTokenValue2] }
        - { Name: !GetAtt EmailIdentity.DkimDNSTokenName3, Type: CNAME, TTL: "1800", ResourceRecords: [!GetAtt EmailIdentity.DkimDNSTokenValue3] }
        - { Name: !Sub "_dmarc.${Domain}", Type: TXT, TTL: "3600", ResourceRecords: [!Sub '"v=DMARC1; p=none; rua=mailto:dmarc@${Domain}"'] }

  # ---- Alerts ----
  AlertTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlertEmail
    Properties:
      TopicName: tabitat-alerts
      Subscription: [{ Protocol: email, Endpoint: !Ref AlertEmail }]
      Tags: [{ Key: Project, Value: tabitat }]
  ServerDownAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlertEmail
    Properties:
      AlarmName: tabitat-server-down
      AlarmDescription: Tabitat's server failed its health checks.
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions: [{ Name: InstanceId, Value: !Ref Server }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions: [!Ref AlertTopic]
  Budget:
    Type: AWS::Budgets::Budget
    Condition: HasAlertEmail
    Properties:
      Budget:
        BudgetName: tabitat-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: !Ref MonthlyBudgetUsd, Unit: USD }
        CostFilters: { TagKeyValue: ["user:Project$tabitat"] }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100 }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]

Outputs:
  NameServers:
    Condition: HasDomain
    Description: Put these four nameservers in at your registrar (GoDaddy).
    Value: !Join [", ", !GetAtt Zone.NameServers]
  ServerIp:
    Description: Point the domain's A records here.
    Value: !Ref PublicIp
  SecurityGroupId:
    Value: !Ref WebSecurityGroup
  StagingBucket:
    Value: !Ref FilesBucketStaging
  ProductionBucket:
    Value: !Ref FilesBucketProduction
  BackupsBucket:
    Value: !Ref BackupsBucket
