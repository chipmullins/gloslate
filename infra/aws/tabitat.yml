AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Tabitat: one small server of its own running staging and production, Postgres
  on a separate data disk with nightly S3 backups, files in S3, email via SES,
  DNS for tabitat.app. The server updates itself from GitHub's package registry,
  so nothing outside AWS ever needs AWS access. Stack name: tabitat.

Parameters:
  Domain:
    Type: String
    Default: tabitat.app
  AlertEmail:
    Type: String
    Description: Where "server is down" and budget alerts go (and Let's Encrypt notices).
  GitHubUser:
    Type: String
    Default: chipmullins
  GitHubPackagesToken:
    Type: String
    NoEcho: true
    Description: A GitHub token with only the read:packages permission, so the server can download new versions of Tabitat.
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t3.medium]
  DataVolumeGiB:
    Type: Number
    Default: 10
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
    Description: Ubuntu 24.04 (leave as is).
  MonthlyBudgetUsd:
    Type: Number
    Default: 25

Conditions:
  HasDomain: !Not [!Equals [!Ref Domain, ""]]
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "Fill these in" }
        Parameters: [AlertEmail, GitHubPackagesToken]
      - Label: { default: "Leave as they are" }
        Parameters: [Domain, GitHubUser, InstanceType, DataVolumeGiB, ImageId, MonthlyBudgetUsd]

Resources:
  # ---- Network (Tabitat's own; no NAT gateway, so no fixed cost) ----
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: tabitat }, { Key: Project, Value: tabitat }]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: tabitat }, { Key: Project, Value: tabitat }]
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref InternetGateway }
  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{ Key: Name, Value: tabitat-public }, { Key: Project, Value: tabitat }]
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: tabitat }, { Key: Project, Value: tabitat }]
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties: { RouteTableId: !Ref RouteTable, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref InternetGateway }
  SubnetRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref Subnet, RouteTableId: !Ref RouteTable }

  # Web only. No SSH at all: emergency access is through AWS Session Manager.
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: tabitat-web
      GroupDescription: Tabitat web (80/443 only)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIpv6: "::/0" }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIpv6: "::/0" }
      Tags: [{ Key: Name, Value: tabitat-web }, { Key: Project, Value: tabitat }]

  # ---- Storage ----
  FilesBucketStaging:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub tabitat-staging-files-${AWS::AccountId}
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption: { ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }] }
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      Tags: [{ Key: Project, Value: tabitat }]
  FilesBucketProduction:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub tabitat-production-files-${AWS::AccountId}
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption: { ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }] }
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      VersioningConfiguration: { Status: Enabled }
      Tags: [{ Key: Project, Value: tabitat }]
  BackupsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub tabitat-backups-${AWS::AccountId}
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption: { ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }] }
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      LifecycleConfiguration:
        Rules: [{ Id: keep-35-days, Status: Enabled, ExpirationInDays: 35 }]
      Tags: [{ Key: Project, Value: tabitat }]

  # ---- Server ----
  ServerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: tabitat-server
      Tags: [{ Key: Project, Value: tabitat }]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: ec2.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore] # Session Manager, instead of SSH
      Policies:
        - PolicyName: tabitat-server
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Files
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:ListBucket]
                Resource:
                  - !GetAtt FilesBucketStaging.Arn
                  - !Sub "${FilesBucketStaging.Arn}/*"
                  - !GetAtt FilesBucketProduction.Arn
                  - !Sub "${FilesBucketProduction.Arn}/*"
              - Sid: BackupsWriteOnly # the server can add backups but never delete them
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${BackupsBucket.Arn}/*"
              - Sid: Email
                Effect: Allow
                Action: [ses:SendEmail, ses:SendRawEmail]
                Resource: "*"
                Condition:
                  StringLike: { "ses:FromAddress": !If [HasDomain, !Sub "*@${Domain}", "nobody@invalid"] }
              - Sid: TextMessages # direct-to-phone only, not topics
                Effect: Allow
                Action: sns:Publish
                NotResource: arn:aws:sns:*:*:*
  ServerProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: { InstanceProfileName: tabitat-server, Roles: [!Ref ServerRole] }

  DataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      AvailabilityZone: !GetAtt Subnet.AvailabilityZone
      Size: !Ref DataVolumeGiB
      VolumeType: gp3
      Encrypted: true
      Tags: [{ Key: Name, Value: tabitat-data }, { Key: Project, Value: tabitat }]

  Server:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref Subnet
      SecurityGroupIds: [!Ref WebSecurityGroup]
      IamInstanceProfile: !Ref ServerProfile
      MetadataOptions: { HttpTokens: required, HttpPutResponseHopLimit: 2 }
      PropagateTagsToVolumeOnCreation: true
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs: { VolumeSize: 16, VolumeType: gp3, Encrypted: true }
      Tags: [{ Key: Name, Value: tabitat }, { Key: Project, Value: tabitat }]
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            set -euxo pipefail
            export DEBIAN_FRONTEND=noninteractive

            # Swap, so a 1 GB server rides out memory spikes.
            if [ ! -f /swapfile ]; then fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile; fi
            swapon /swapfile || true
            grep -q /swapfile /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab

            apt-get update -qq
            apt-get install -y -qq docker.io docker-compose-v2 unattended-upgrades
            snap install aws-cli --classic || true
            systemctl enable --now docker

            # Database disk: wait for it to attach, format only if new, mount at /data.
            DEV=/dev/disk/by-id/nvme-Amazon_Elastic_Block_Store_${VolNoDash}
            for i in $(seq 1 60); do [ -e "$DEV" ] && break; sleep 5; done
            blkid "$DEV" || mkfs.ext4 -q -L tabitat-data "$DEV"
            mkdir -p /data
            grep -q tabitat-data /etc/fstab || echo 'LABEL=tabitat-data /data ext4 defaults,nofail 0 2' >> /etc/fstab
            mount -a

            # Settings. Secrets are made once, here, and never leave the server's data disk.
            install -d -m 700 /data/env /opt/tabitat
            printf 'AWS_REGION=${AWS::Region}\nACME_EMAIL=${AlertEmail}\n' > /data/env/server.env
            echo "S3_BUCKET=${StagingBucket}" > /data/env/staging.server.env
            echo "S3_BUCKET=${ProductionBucket}" > /data/env/production.server.env
            for env in staging production; do
              f=/data/env/$env.secrets.env
              if [ ! -f "$f" ]; then
                pw=$(openssl rand -hex 24)
                printf 'SECRET_KEY_BASE=%s\nTABITAT_DATABASE_PASSWORD=%s\nPOSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 64)" "$pw" "$pw" > "$f"
              fi
            done
            printf '%s\n%s\n' '${GitHubUser}' '${GitHubPackagesToken}' > /data/env/ghcr
            chmod 600 /data/env/*

            # The updater: every 2 minutes, pull Tabitat's newest images from GitHub's registry
            # and restart whatever changed. Config (compose.yml, Caddyfile, *.env) ships inside the image.
            cat > /usr/local/bin/tabitat-update <<'EOS'
            #!/bin/bash
            set -uo pipefail
            IMG=ghcr.io/${GitHubUser}/tabitat-api
            cd /opt/tabitat || exit 1
            { read -r user; read -r token; } < /data/env/ghcr
            echo "$token" | docker login ghcr.io -u "$user" --password-stdin >/dev/null 2>&1 || echo "registry login failed"
            have=()
            for t in staging production; do docker pull -q "$IMG:$t" >/dev/null 2>&1 && have+=("$t"); done
            [ ${!#have[@]} -eq 0 ] && { echo "no Tabitat images yet"; exit 0; }
            # Shared files come from production once it exists, so staging changes can't affect it early.
            src="$IMG:${!have[-1]}"
            cid=$(docker create "$src")
            old=$(sha256sum Caddyfile 2>/dev/null)
            for f in compose.yml Caddyfile; do docker cp "$cid:/rails/deploy/$f" "$f.new" && mv "$f.new" "$f"; done
            docker rm "$cid" >/dev/null
            for t in "${!have[@]}"; do
              cid=$(docker create "$IMG:$t"); docker cp "$cid:/rails/deploy/$t.env" "$t.env"; docker rm "$cid" >/dev/null
              mkdir -p "/data/pg-$t"
            done
            mkdir -p /data/caddy
            services=(caddy); for t in "${!have[@]}"; do services+=("$t-db" "$t-web"); done
            docker compose up -d --remove-orphans "${!services[@]}"
            [ "$old" != "$(sha256sum Caddyfile)" ] && docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile >/dev/null 2>&1
            docker image prune -f >/dev/null
            EOS
            chmod 755 /usr/local/bin/tabitat-update
            cat > /etc/systemd/system/tabitat-update.service <<'EOS'
            [Unit]
            Description=Update Tabitat from GitHub's registry
            After=docker.service network-online.target
            [Service]
            Type=oneshot
            ExecStart=/usr/local/bin/tabitat-update
            EOS
            cat > /etc/systemd/system/tabitat-update.timer <<'EOS'
            [Unit]
            Description=Check for a new Tabitat every 2 minutes
            [Timer]
            OnBootSec=30s
            OnUnitActiveSec=2min
            [Install]
            WantedBy=timers.target
            EOS
            systemctl daemon-reload
            systemctl enable --now tabitat-update.timer

            # Nightly database backups to S3 (03:15 UTC), kept 35 days.
            cat > /usr/local/bin/tabitat-backup <<'EOS'
            #!/bin/bash
            set -euo pipefail
            for c in $(docker ps --format '{{.Names}}' | grep -E '^tabitat-(staging|production)-db$'); do
              docker exec "$c" pg_dumpall -U tabitat | gzip | \
                /snap/bin/aws s3 cp - "s3://${Bucket}/$c/$(date -u +%Y-%m-%dT%H%M).sql.gz" --only-show-errors
            done
            EOS
            chmod 755 /usr/local/bin/tabitat-backup
            echo '15 3 * * * root /usr/local/bin/tabitat-backup >> /var/log/tabitat-backup.log 2>&1' > /etc/cron.d/tabitat-backup
          - VolNoDash: !Join ["", !Split ["-", !Ref DataVolume]]
            Bucket: !Ref BackupsBucket
            StagingBucket: !Ref FilesBucketStaging
            ProductionBucket: !Ref FilesBucketProduction

  DataAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties: { InstanceId: !Ref Server, VolumeId: !Ref DataVolume, Device: /dev/sdf }

  PublicIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref Server
      Tags: [{ Key: Name, Value: tabitat }, { Key: Project, Value: tabitat }]

  # ---- Email (once the domain exists): add the DKIM records it lists ----
  EmailIdentity:
    Type: AWS::SES::EmailIdentity
    Condition: HasDomain
    Properties:
      EmailIdentity: !Ref Domain
      DkimSigningAttributes: { NextSigningKeyLength: RSA_2048_BIT }

  # ---- DNS for the domain (set the registrar's nameservers to the NameServers output) ----
  Zone:
    Type: AWS::Route53::HostedZone
    Condition: HasDomain
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Ref Domain
      HostedZoneTags: [{ Key: Project, Value: tabitat }]
  SiteRecords:
    Type: AWS::Route53::RecordSetGroup
    Condition: HasDomain
    Properties:
      HostedZoneId: !Ref Zone
      RecordSets:
        - { Name: !Ref Domain, Type: A, TTL: "300", ResourceRecords: [!Ref PublicIp] }
        - { Name: !Sub "api.${Domain}", Type: A, TTL: "300", ResourceRecords: [!Ref PublicIp] }
        - { Name: !Sub "admin-api.${Domain}", Type: A, TTL: "300", ResourceRecords: [!Ref PublicIp] }
        - { Name: !Sub "staging.${Domain}", Type: A, TTL: "300", ResourceRecords: [!Ref PublicIp] }
        - { Name: !Sub "www.${Domain}", Type: A, TTL: "300", ResourceRecords: [!Ref PublicIp] }
  EmailRecords:
    Type: AWS::Route53::RecordSetGroup
    Condition: HasDomain
    Properties:
      HostedZoneId: !Ref Zone
      RecordSets:
        - { Name: !GetAtt EmailIdentity.DkimDNSTokenName1, Type: CNAME, TTL: "1800", ResourceRecords: [!GetAtt EmailIdentity.DkimDNSTokenValue1] }
        - { Name: !GetAtt EmailIdentity.DkimDNSTokenName2, Type: CNAME, TTL: "1800", ResourceRecords: [!GetAtt EmailIdentity.DkimDNSTokenValue2] }
        - { Name: !GetAtt EmailIdentity.DkimDNSTokenName3, Type: CNAME, TTL: "1800", ResourceRecords: [!GetAtt EmailIdentity.DkimDNSTokenValue3] }
        - { Name: !Sub "_dmarc.${Domain}", Type: TXT, TTL: "3600", ResourceRecords: [!Sub '"v=DMARC1; p=none; rua=mailto:dmarc@${Domain}"'] }

  # ---- The "Tabitat" dashboard in CloudWatch: the server at a glance ----
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: Tabitat
      DashboardBody: !Sub |
        {"widgets":[
          {"type":"text","x":0,"y":0,"width":24,"height":2,"properties":{"markdown":"# Tabitat\nOne server (staging + production), updates itself every 2 minutes. Resources: Resource Groups → **Tabitat**. Costs: Cost Explorer, filter tag Project = tabitat."}},
          {"type":"metric","x":0,"y":2,"width":12,"height":6,"properties":{"title":"Server CPU %","region":"${AWS::Region}","stat":"Average","period":300,"metrics":[["AWS/EC2","CPUUtilization","InstanceId","${Server}"]]}},
          {"type":"metric","x":12,"y":2,"width":12,"height":6,"properties":{"title":"Health checks failed","region":"${AWS::Region}","stat":"Maximum","period":300,"metrics":[["AWS/EC2","StatusCheckFailed","InstanceId","${Server}"]]}},
          {"type":"metric","x":0,"y":8,"width":12,"height":6,"properties":{"title":"Network in / out","region":"${AWS::Region}","stat":"Sum","period":300,"metrics":[["AWS/EC2","NetworkIn","InstanceId","${Server}"],["AWS/EC2","NetworkOut","InstanceId","${Server}"]]}},
          {"type":"metric","x":12,"y":8,"width":12,"height":6,"properties":{"title":"Data disk I/O","region":"${AWS::Region}","stat":"Sum","period":300,"metrics":[["AWS/EBS","VolumeWriteOps","VolumeId","${DataVolume}"],["AWS/EBS","VolumeReadOps","VolumeId","${DataVolume}"]]}}
        ]}

  # ---- "Tabitat" in Resource Groups: everything tagged Project=tabitat ----
  ResourceGroup:
    Type: AWS::ResourceGroups::Group
    Properties:
      Name: Tabitat
      Description: Everything tagged Project tabitat
      ResourceQuery:
        Type: TAG_FILTERS_1_0
        Query:
          ResourceTypeFilters: [AWS::AllSupported]
          TagFilters: [{ Key: Project, Values: [tabitat] }]
      Tags: [{ Key: Project, Value: tabitat }]

  # ---- Alerts ----
  AlertTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlertEmail
    Properties:
      TopicName: tabitat-alerts
      Subscription: [{ Protocol: email, Endpoint: !Ref AlertEmail }]
      Tags: [{ Key: Project, Value: tabitat }]
  ServerDownAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlertEmail
    Properties:
      AlarmName: tabitat-server-down
      AlarmDescription: Tabitat's server failed its health checks.
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions: [{ Name: InstanceId, Value: !Ref Server }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions: [!Ref AlertTopic]
  Budget:
    Type: AWS::Budgets::Budget
    Condition: HasAlertEmail
    Properties:
      Budget:
        BudgetName: tabitat-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: !Ref MonthlyBudgetUsd, Unit: USD }
        CostFilters: { TagKeyValue: ["user:Project$tabitat"] }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100 }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]

Outputs:
  NameServers:
    Condition: HasDomain
    Description: Put these four nameservers in at your registrar (GoDaddy).
    Value: !Join [", ", !GetAtt Zone.NameServers]
  ServerIp:
    Description: Point the domain's A records here.
    Value: !Ref PublicIp
  StagingBucket:
    Value: !Ref FilesBucketStaging
  ProductionBucket:
    Value: !Ref FilesBucketProduction
  BackupsBucket:
    Value: !Ref BackupsBucket
